name: build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - "unstable"
      - "main"
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
      - "module/**"
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        go-version: ["1.25"]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - shell: bash
        run: ./.github/script/setup.sh
      - shell: bash
        run: ./.github/script/check.sh
      - shell: bash
        run: ./.github/script/test.sh
